[app]
	version = "v 0.1.0"
	title = "MapCloud Tiler"
[output]
	#can be mbtiles/file/s3
	format ="file"
	#file/mbtiles output dir; also holds the default local S3 failure manifest
	directory ="output"
	#skip existing nonempty tiles; keep the same source and output settings
	resume = false
	#append another region to the same dataset; implies resume
	#file/mbtiles append requires a fixed nonempty name below
	append = false
	#optional fixed file/mbtiles basename; resume defaults to Name-zmin-max
	name = ""
	#relative tile layout for file/S3 outputs; keep unchanged when resuming
	#also supports {z}/{y}/{x}.{format}, {-y}, fixed subdirs, or no extension
	tile_path = "{z}/{x}/{y}.{format}"
	#optional PBF gzip override: file defaults false; mbtiles/s3 default true
	#gzip_pbf = true
	#optional JSON failure manifest path; repair reuses the original output target
	#failure_file = "output/failures.json"
[output.s3]
	#used for direct S3 output and the upload command; bucket must already exist
	bucket = ""
	#direct tile key: prefix + output.tile_path; convert URIs specify their own path
	prefix = "tiles"
	#leave empty to use AWS_REGION, AWS_DEFAULT_REGION, or the AWS profile
	region = ""
	#optional S3-compatible endpoint, e.g. http://localhost:9000 for MinIO
	endpoint = ""
	#MinIO generally needs true; AWS S3 can use false
	force_path_style = false
	#positive timeout per direct tile upload; archive upload uses CLI -timeout
	timeout_seconds = 60
	#credentials come from the AWS SDK default chain, not this file
[task]
	#number of fetchers
	workers = 3
	#number of savers
	savepipe = 1
	#min request interval, a speed limit, unit millisecond
	timedelay = 50
	#download request timeout in seconds; must be positive
	timeout_seconds = 30
	#additional attempts for network errors and HTTP 408/429/5xx
	retries = 3
	#optional source-specific request headers
	#user_agent = "Tiler"
	#referer = "https://map.tianditu.gov.cn/"

[tm]
	#name for mbtiles
	name = "google satelite"
	#metadata zoom bounds are derived from the actual [[lrs]] layers
	min = 0
	max = 11
	#pbf/png/jpg; png/jpg convert the actual image encoding
	format = "jpg"
	#can be xyz/tms (Web Mercator only)
	schema = "xyz"
	#vector TileJSON metadata; PMTiles PBF conversion requires valid vector_layers
	# json = ""
	#url is the schema url of tiles; replace YOUR_API_TOKEN with your own provider token
	# url = "https://api.mapbox.com/v4/mapbox.mapbox-streets-v8/{z}/{x}/{y}.vector.pbf?sku=1016gFniej06a&access_token=YOUR_API_TOKEN"
	# url = "https://api.mapbox.com/v4/mapbox.mapbox-terrain-v2/{z}/{x}/{y}.vector.pbf?sku=1016gFniej06a&access_token=YOUR_API_TOKEN"
	# url = "https://api.maptiler.com/tiles/v3/{z}/{x}/{y}.pbf?key=YOUR_API_TOKEN"
	# url = "http://mt0.google.com/vt/lyrs=s&x={x}&y={y}&z={z}"
	# url = "https://t0.tianditu.gov.cn/DataServer?T=vec_w&x={x}&y={y}&l={z}&tk=YOUR_API_TOKEN"
	url = "https://t0.tianditu.gov.cn/DataServer?T=img_w&x={x}&y={y}&l={z}&tk=YOUR_API_TOKEN"
#lrs can set diff boundaries for diff levels
  [[lrs]]
  	min = 0
  	max = 5
  	geojson = "./geojson/global.geojson"
 [[lrs]]
 	min = 6
 	max = 8
 	geojson = "./geojson/china.geojson"
  [[lrs]]
 	min = 9
  	max = 10
  	geojson = "./geojson/jiangsu.geojson"
 [[lrs]]
  	min = 11
  	max = 11
    geojson = "./geojson/nanjing.geojson"
